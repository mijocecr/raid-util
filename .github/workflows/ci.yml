name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test and CLI smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            RAID-Util.sln
            tests/RAID-Util.Tests/RAID-Util.Tests.csproj

      - name: Restore
        run: dotnet restore RAID-Util.sln

      - name: Build (Release, warnings as errors for our code)
        run: dotnet build RAID-Util.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test RAID-Util.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: CLI smoke
        run: ./scripts/smoke-cli.sh
